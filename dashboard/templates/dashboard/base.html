<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Панель управления SoundBound{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <div class="flex min-h-screen">
      <!-- Боковое меню -->
      <aside class="w-64 bg-gray-900 text-white p-6">
        <h2 class="text-2xl font-bold mb-10 px-4">SoundBound</h2>

        <nav class="flex flex-col gap-3">
          <a
            href="{% url 'dashboard_home' %}"
            class="rounded-lg px-4 py-3 transition {% if request.resolver_match.url_name == 'dashboard_home' %} bg-blue-600 text-white {% else %} hover:bg-gray-800 {% endif %}"
          >
            Главная
          </a>

          <a
            href="{% url 'users_list' %}"
            class="rounded-lg px-4 py-3 transition {% if request.resolver_match.url_name == 'users_list' or request.resolver_match.url_name == 'toggle_user_status' or request.resolver_match.url_name == 'toggle_user_role' %} bg-blue-600 text-white {% else %} hover:bg-gray-800 {% endif %}"
          >
            Пользователи
          </a>

          <a
            href="{% url 'purchases_list' %}"
            class="rounded-lg px-4 py-3 transition {% if request.resolver_match.url_name == 'purchases_list' %} bg-blue-600 text-white {% else %} hover:bg-gray-800 {% endif %}"
          >
            Покупки
          </a>
        </nav>
        <div class="mt-10 pt-6 border-t border-gray-700">
          <p class="text-xs uppercase tracking-wider text-gray-500 px-4 mb-3">
            Основной сайт
          </p>

          <a
            href="/"
            class="flex items-center justify-between rounded-lg px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800 transition"
          >
            <span>Музыкальный каталог</span>
            <span class="text-gray-500">↗</span>
          </a>
        </div>
      </aside>

      <!-- Основная область -->
      <main class="flex-1 p-8">{% block content %} {% endblock %}</main>
    </div>
  </body>
</html>
